name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Validate
      run: |
        terraform -chdir=terraform init -backend=false
        terraform -chdir=terraform validate

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Ansible Syntax Check
      run: |
        pip install ansible-core
        ansible-playbook -i ansible/inventory.ini ansible/setup.yml --syntax-check

  build-deploy:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Start Minikube
      uses: medyagh/setup-minikube@latest

    - name: Build Docker Image
      run: docker build -t devops-lab-app:latest ./app

    - name: Load Image into Minikube
      run: minikube image load devops-lab-app:latest

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yml
        kubectl apply -f k8s/service.yml
        kubectl rollout status deployment/devops-app --timeout=180s

    - name: Verify Deployment
      run: |
        kubectl get deployments,pods,services
        kubectl port-forward service/devops-service 8080:80 &
        sleep 5
        curl -s --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080
